<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aftermind Explorer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span> Aftermind Explorer</div>
    <div class="scope-picker">
      <label class="muted" style="font-size:12px;">Project</label>
      <select id="scope-select"><option value="">All projects</option></select>
    </div>
  </header>
  <nav id="nav">
    <button data-view="overview" class="active"><span class="icon">◎</span> Overview</button>
    <button data-view="ledger"><span class="icon">☰</span> What it remembers</button>
    <button data-view="graph"><span class="icon">◈</span> How things connect</button>
    <button data-view="docs"><span class="icon">▤</span> Written knowledge</button>
    <button data-view="sessions"><span class="icon">◷</span> Work history</button>
    <button data-view="trace"><span class="icon">⌕</span> Why this answer?</button>
  </nav>
  <main id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
