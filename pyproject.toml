[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftermind"
version = "0.1.0"
description = "Framework-neutral, persistent memory runtime for AI agents: observe, recall, checkpoint, consolidate."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
graph = ["graphiti-core>=0.30", "neo4j>=5"]
mcp = ["mcp>=1.0"]
semantic = ["sentence-transformers>=3"]
dev = ["pytest>=8"]
all = ["aftermind[graph,mcp,semantic]"]

[project.scripts]
aftermind = "apps.cli:main"

[project.urls]
Homepage = "https://github.com/sammyview80/Aftermind"

[tool.setuptools.packages.find]
include = ["domain*", "core*", "providers*", "apps*", "integrations*", "sdk*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"providers.llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
python_files = [
    "test_*.py",
    "*_test.py",
    "recall_accuracy.py",
    "cross_session_continuity.py",
    "checkpoint_resume.py",
    "project_isolation.py",
    "consolidation_quality.py",
    "context_budget.py",
]
