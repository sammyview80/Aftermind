name: aftermind
version: "1.0"
description: >
  Recalls Aftermind memory before each turn (pre_llm_call) and injects it
  into the user message; observes each turn and tool call
  (post_llm_call/post_tool_call); automatically checkpoints on session
  end/finalize/reset by summarizing the last observed turn via
  /checkpoint/from-text.
